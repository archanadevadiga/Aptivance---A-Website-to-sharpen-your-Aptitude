<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="aptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="iconGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="url(#aptBg)" rx="16"/>

  <!-- Subtle grid lines in bg -->
  <g opacity="0.05" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- APTIVANCE Stylized Monogram Icon -->
  <g transform="translate(50, 35)">
    <!-- Outer ambient glow ring -->
    <circle cx="85" cy="85" r="80" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.2" stroke-dasharray="6 6"/>
    
    <!-- Left leg of A (deep blue to bright cyan) -->
    <path d="M 40,150 L 75,35 L 98,35 L 75,150 Z" fill="url(#iconGrad1)" filter="url(#glow)"/>
    
    <!-- Right leg of A (cyan to teal) -->
    <path d="M 75,35 L 110,35 L 145,150 L 122,150 Z" fill="url(#iconGrad2)"/>
    
    <!-- Crossbar / Dynamic Forward-Advance Arrow (Gold / Amber) -->
    <!-- Represents Aptitude Advancement -->
    <path d="M 45,115 L 125,115 L 140,95 L 60,95 Z" fill="url(#arrowGrad)" filter="url(#glow)"/>
    <path d="M 105,95 L 145,105 L 125,125 Z" fill="#F59E0B"/>

    <!-- Diamond apex accent -->
    <polygon points="92.5,22 101,32 92.5,42 84,32" fill="#67E8F9"/>
  </g>

  <!-- Typography: APTIVANCE -->
  <g transform="translate(250, 135)">
    <text font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="url(#textGrad)">
      APTI<tspan fill="url(#arrowGrad)">VANCE</tspan>
    </text>
    <!-- Tagline underneath -->
    <text y="46" font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="8" fill="#94A3B8">
      PLACEMENT &amp; APTITUDE PORTAL
    </text>
    <!-- Modern tech underline -->
    <rect x="0" y="58" width="480" height="2.5" rx="1.2" fill="url(#iconGrad2)" opacity="0.8"/>
    <rect x="0" y="58" width="120" height="2.5" rx="1.2" fill="url(#arrowGrad)"/>
  </g>
</svg>